<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treinos Pah">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>Treinos Pah</title>
</head>
<body>
<header class="app-header">
  <div>
    <div class="brand">TP</div>
    <div>
      <p class="eyebrow">TREINOS PAH</p>
      <h1>Minha semana</h1>
      <p id="weekLabel" class="muted"></p>
    </div>
  </div>
  <button id="installBtn" class="install-btn hidden" type="button">⬇ Instalar app</button>
</header>

<main class="app-shell">
  <section class="summary card">
    <div class="summary-top">
      <div>
        <span class="muted">Progresso semanal</span>
        <strong id="progressText">0% concluído</strong>
      </div>
      <button id="resetBtn" class="icon-btn" type="button" aria-label="Resetar semana">↻</button>
    </div>
    <div class="progress"><span id="progressBar"></span></div>
  </section>

  <nav id="tabs" class="tabs" aria-label="Dias da semana"></nav>

  <section id="dayContent"></section>
</main>

<div id="installHelp" class="modal hidden">
  <div class="modal-box">
    <button id="closeInstallHelp" class="modal-close">×</button>
    <h3>Adicionar à tela inicial</h3>
    <p>No iPhone/iPad: abra no Safari, toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>.</p>
    <p>No Android/Chrome, use o botão <b>Instalar app</b> quando ele aparecer.</p>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
